name: Build APK
on:
  push:
    paths:
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Download and build
        run: |
          set -ex
          curl -fL --retry 3 https://github.com/Kerem153/app/releases/download/1.0/uygulama.zip -o source.zip
          unzip -q source.zip -d source
          find source -maxdepth 3 -type f | sed -n '1,80p'
          project="$(find source -iname apktool.yml -print -quit)"
          if [ -z "$project" ] && [ -d source/uygulama/smali ]; then
            python3 - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          p = Path("source/uygulama")
          root = ET.parse(p / "AndroidManifest.xml").getroot()
          ns = "{http://schemas.android.com/apk/res/android}"
          sdk = root.find("uses-sdk")
          minimum = sdk.get(ns+"minSdkVersion", "23") if sdk is not None else "23"
          target = sdk.get(ns+"targetSdkVersion", "35") if sdk is not None else "35"
          version = root.get(ns+"versionCode", "1")
          name = root.get(ns+"versionName", "1.0")
          import json
          (p / "apktool.yml").write_text("version: 2.12.1\napkFileName: uygulama.apk\nisFrameworkApk: false\nusesFramework:\n  ids:\n  - 1\nsdkInfo:\n  minSdkVersion: "+json.dumps(minimum)+"\n  targetSdkVersion: "+json.dumps(target)+"\npackageInfo:\n  forcedPackageId: 127\nversionInfo:\n  versionCode: "+json.dumps(version)+"\n  versionName: "+json.dumps(name)+"\nresourcesAreCompressed: false\nsharedLibrary: false\nsparseResources: false\nunknownFiles: {}\ndoNotCompress:\n- resources.arsc\n- so\n")
          PY
            project=source/uygulama/apktool.yml
          fi
          if [ -z "$project" ]; then
            echo "apktool.yml missing. Checking for original APK or packaged Android files."
            apk="$(find source -iname '*.apk' -print -quit)"
            if [ -n "$apk" ]; then
              cp "$apk" unsigned.apk
            else
              manifest="$(find source -iname AndroidManifest.xml -print -quit)"
              if [ -n "$manifest" ] && [ -f "$(dirname "$manifest")/classes.dex" ] && [ -f "$(dirname "$manifest")/resources.arsc" ]; then
                (cd "$(dirname "$manifest")" && zip -q -0 -r "$GITHUB_WORKSPACE/unsigned.apk" . -x 'META-INF/*')
              else
                echo "No buildable APK project found"
                exit 1
              fi
            fi
          fi
          if [ ! -f unsigned.apk ]; then
            curl -fL https://github.com/iBotPeaches/Apktool/releases/download/v2.12.1/apktool_2.12.1.jar -o apktool.jar
            python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path("source/uygulama/res/values-v31/colors.xml")
          if p.exists():
              s = p.read_text()
              s = re.sub(r'@android:color/', '@*android:color/', s)
              p.write_text(s)
          PY
            for attempt in $(seq 1 12); do
              if java -Xmx5g -jar apktool.jar b "$(dirname "$project")" -o unsigned.apk > build.log 2>&1; then
                cat build.log
                break
              fi
              cat build.log
              python3 - <<'PY'
          import re
          from pathlib import Path
          log = Path("build.log").read_text()
          changes = 0
          for path, name, reason in re.findall(r'(/[^:\n]+\.xml):\d+: error: resource android:color/([\w]+) (is private|not found)', log):
              p = Path(path)
              if not p.is_file():
                  continue
              s = p.read_text()
              pattern = r'@\*?android:color/' + re.escape(name) + r'\b'
              replacement = '@*android:color/' + name if reason == 'is private' else '#ff000000'
              new = re.sub(pattern, lambda m: replacement, s)
              if new != s:
                  p.write_text(new)
                  changes += 1
          print("Corrected references:", changes)
          if not changes:
              raise SystemExit(1)
          PY
            done
            test -s unsigned.apk
          fi
          tools="$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)"
          test -n "$tools"
          "$(dirname "$tools")/zipalign" -P 16 -f 4 unsigned.apk aligned.apk
          keytool -genkeypair -keystore build.jks -storepass android -keypass android -alias build -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Build"
          "$tools" sign --ks build.jks --ks-pass pass:android --key-pass pass:android --out uygulama.apk aligned.apk
          "$tools" verify uygulama.apk
      - name: Publish APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload 1.0 uygulama.apk --repo "${{ github.repository }}" --clobber
